<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michał Trzaska (55661) - AI LAB B</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
<main>
    <h1>Lista zadań</h1>
    <label for="task-search">Wyszukaj zadanie</label>
    <input id="task-search" name="search" type="search" placeholder="Wpisz co najmniej 2 znaki">
    <p class="hint">Kliknij zadanie, aby zmienić treść lub termin. Kliknięcie poza nim zapisuje zmiany.</p>
    <ul id="task-list"></ul>
    <p id="empty-message">Brak zadań. Dodaj pierwsze zadanie poniżej.</p>
    <form id="task-form">
        <label for="task-name">Nowe zadanie</label>
        <input id="task-name" name="task" type="text" placeholder="Wpisz treść zadania" minlength="3" maxlength="255" required>
        <label for="task-deadline">Termin wykonania (opcjonalny)</label>
        <input id="task-deadline" name="deadline" type="datetime-local">
        <button type="submit">Dodaj zadanie</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
</main>
</body>
</html>
